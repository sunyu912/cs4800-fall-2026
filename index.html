<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 60px auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        input {
            padding: 10px;
            font-size: 16px;
            width: 200px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        ul {
            padding: 0;
        }

        li {
            list-style: none;
            background-color: white;
            margin: 10px 0;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>5 Dollar Lunch by CPP</h1>
    <input type="text" id="budget"></input>
    <button onclick="search()">Search</button>
    <ul id="results"></ul>

    <script>

    async function search() {

        // get the input value

        let budget = document.getElementById("budget").value.trim();

        // validate the input

        if (budget === "" || isNaN(budget) || Number(budget) < 0) {

            alert("Please enter a valid price.");

            return;

        }

        // convert to number

        budget = Number(budget);

        // make an HTTP call to the server

        let response = await fetch("/search_mongo/" + budget);

        // parse the result

        let foods = await response.json();

        // display the result

        let ul = document.getElementById("results");

        ul.innerHTML = "";

        for (let food of foods) {

            ul.innerHTML += "<li>" + food.name + " - $" + food.price + "</li>";

        }

    }

</script>
</body>
</html>
